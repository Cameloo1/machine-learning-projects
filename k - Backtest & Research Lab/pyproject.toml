[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-lab"
version = "0.1.0"
description = "Backtest & Research Lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0,<3.0.0",
  "numpy>=1.24.0,<2.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "matplotlib>=3.7.0,<4.0.0",
  "jinja2>=3.1.0,<4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
